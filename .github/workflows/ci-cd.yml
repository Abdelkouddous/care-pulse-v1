name: VitalBook CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend Tests (Pest & PHP 8.4)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, redis
          coverage: none

      - name: Install Composer Dependencies
        working-directory: ./apps/api
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Backend Pest Tests
        working-directory: ./apps/api
        run: php artisan test

  frontend-build:
    name: Frontend Verification & Build (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './apps/web/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./apps/web
        run: npm ci

      - name: Typecheck
        working-directory: ./apps/web
        run: npx tsc --noEmit

      - name: Build Next.js Production App
        working-directory: ./apps/web
        env:
          NEXT_PUBLIC_API_URL: https://api-vitalbook.aymenhamel.com/api/v1
          NEXT_PUBLIC_ADMIN_PASSKEY: '123456'
          NEXT_PUBLIC_DOCTOR_PASSKEY: '654321'
        run: npm run build
