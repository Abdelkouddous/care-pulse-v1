name: Deploy Wateen Book to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Google Play Release Track"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    name: Build & Deploy AAB to Play Console
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Restore Keystore from Secrets
        working-directory: ./apps/mobile/android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/upload-keystore.jks

      - name: Create key.properties
        working-directory: ./apps/mobile/android
        run: |
          cat <<EOF > key.properties
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Install Dependencies
        working-directory: ./apps/mobile
        run: flutter pub get

      - name: Run Quality Gate Tests
        working-directory: ./apps/mobile
        run: flutter test

      - name: Build Release Android App Bundle
        working-directory: ./apps/mobile
        run: flutter build appbundle --release

      - name: Upload AAB to Google Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_CONFIG_JSON }}
          packageName: com.wateensoft.wateenbook
          releaseFiles: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed
