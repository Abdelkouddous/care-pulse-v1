services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carepulse-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: CarePulse
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "base64:HrB/et5Yh+1paB4NOVNQTjpj5H2rRLxjS+gPCOYhT6A="
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: carepulse
      DB_USERNAME: carepulse_user
      DB_PASSWORD: carepulse_secret_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - carepulse-network

  postgres:
    image: postgres:18-alpine
    container_name: carepulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: carepulse
      POSTGRES_USER: carepulse_user
      POSTGRES_PASSWORD: carepulse_secret_password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carepulse_user -d carepulse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carepulse-network

  redis:
    image: redis:alpine
    container_name: carepulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carepulse-network

volumes:
  pgdata:
  redisdata:

networks:
  carepulse-network:
    driver: bridge
