# ==============================================================================
# CarePulse Monorepo Netlify Build Configuration
# ==============================================================================

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  # Essential Next.js plugin for SSR, Middleware, and Server Actions support
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NETLIFY_USE_YARN = "false"
  NPM_FLAGS = "--legacy-peer-deps"
