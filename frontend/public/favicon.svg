<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#059669"/>
      <stop offset="55%"  stop-color="#10b981"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="25%" r="70%">
      <stop offset="0%"   stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0.5"/>
    </linearGradient>
    <!-- Crescent mask: full circle minus offset circle = crescent -->
    <mask id="crescent-mask">
      <circle cx="93"  cy="107" r="18" fill="white"/>
      <circle cx="105" cy="100" r="16" fill="black"/>
    </mask>
    <filter id="soft-shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#047857" flood-opacity="0.35"/>
    </filter>
    <filter id="symbol-glow">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#34d399" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="42" ry="42" fill="url(#bg)" filter="url(#soft-shadow)"/>
  <rect width="200" height="200" rx="42" ry="42" fill="url(#glow)"/>

  <!-- Calendar body -->
  <rect x="32" y="60" width="136" height="106" rx="12" ry="12" fill="white" opacity="0.97"/>
  <!-- Calendar header band -->
  <rect x="32" y="60" width="136" height="28" rx="12" ry="12" fill="#d1fae5"/>
  <rect x="32" y="76" width="136" height="12" fill="#d1fae5"/>

  <!-- Calendar binding pegs -->
  <rect x="68"  y="42" width="11" height="28" rx="5.5" ry="5.5" fill="white" opacity="0.88"/>
  <rect x="121" y="42" width="11" height="28" rx="5.5" ry="5.5" fill="white" opacity="0.88"/>

  <!-- Date grid dots (appointment slots) -->
  <circle cx="68"  cy="118" r="5.5" fill="#a7f3d0"/>
  <circle cx="100" cy="118" r="5.5" fill="#34d399"/>
  <circle cx="132" cy="118" r="5.5" fill="#a7f3d0"/>
  <circle cx="68"  cy="140" r="5.5" fill="#34d399"/>
  <circle cx="100" cy="140" r="5.5" fill="#a7f3d0"/>
  <circle cx="132" cy="140" r="5.5" fill="#a7f3d0"/>

  <!-- ===== CRESCENT MOON (replaces medical cross) ===== -->
  <circle cx="93" cy="107" r="18" fill="#059669" mask="url(#crescent-mask)" filter="url(#symbol-glow)"/>

  <!-- ===== FIVE-POINTED STAR ===== -->
  <polygon
    points="114,87 115.6,91.8 120.7,91.8 116.6,94.8 118.2,99.6 114,96.6 109.8,99.6 111.4,94.8 107.3,91.8 112.4,91.8"
    fill="#059669"
    filter="url(#symbol-glow)"
  />

  <!-- Heartbeat pulse line -->
  <polyline
    points="34,165  50,165  58,151  67,179  78,143  88,165  112,165  120,155  129,170  138,165  166,165"
    fill="none"
    stroke="url(#pulse)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
