<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#059669"/>
      <stop offset="55%"  stop-color="#10b981"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="25%" r="70%">
      <stop offset="0%"   stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#059669"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0.5"/>
    </linearGradient>
    <!-- Crescent mask for logo icon -->
    <mask id="crescent-mask-logo">
      <circle cx="55"  cy="65" r="11" fill="white"/>
      <circle cx="62" cy="61" r="9.5" fill="black"/>
    </mask>
    <filter id="iconShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#047857" flood-opacity="0.3"/>
    </filter>
    <filter id="symbol-glow">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#34d399" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- ==================== ICON MARK (120×120) ==================== -->
  <rect x="0" y="0" width="120" height="120" rx="26" ry="26" fill="url(#bg)" filter="url(#iconShadow)"/>
  <rect x="0" y="0" width="120" height="120" rx="26" ry="26" fill="url(#glow)"/>

  <!-- Calendar body -->
  <rect x="17" y="34" width="86" height="68" rx="8" ry="8" fill="white" opacity="0.97"/>
  <!-- Calendar header band -->
  <rect x="17" y="34" width="86" height="20" rx="8" ry="8" fill="#d1fae5"/>
  <rect x="17" y="46" width="86" height="8" fill="#d1fae5"/>

  <!-- Calendar binding pegs -->
  <rect x="37" y="22" width="8" height="20" rx="4" ry="4" fill="white" opacity="0.88"/>
  <rect x="75" y="22" width="8" height="20" rx="4" ry="4" fill="white" opacity="0.88"/>

  <!-- Date grid dots -->
  <circle cx="38" cy="70" r="4" fill="#a7f3d0"/>
  <circle cx="60" cy="70" r="4" fill="#34d399"/>
  <circle cx="82" cy="70" r="4" fill="#a7f3d0"/>
  <circle cx="38" cy="87" r="4" fill="#34d399"/>
  <circle cx="60" cy="87" r="4" fill="#a7f3d0"/>
  <circle cx="82" cy="87" r="4" fill="#a7f3d0"/>

  <!-- ===== CRESCENT MOON ===== -->
  <circle cx="55" cy="65" r="11" fill="#059669" mask="url(#crescent-mask-logo)" filter="url(#symbol-glow)"/>

  <!-- ===== FIVE-POINTED STAR ===== -->
  <polygon
    points="68,54 69.1,57.5 72.7,57.5 69.9,59.6 71,63.1 68,61 65,63.1 66.1,59.6 63.3,57.5 66.9,57.5"
    fill="#059669"
    filter="url(#symbol-glow)"
  />

  <!-- Heartbeat pulse line -->
  <polyline
    points="19,101  31,101  37,91  44,111  52,82  59,101  72,101  78,93  84,105  91,101  103,101"
    fill="none"
    stroke="url(#pulse)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- ==================== WORDMARK ==================== -->

  <!-- Separator -->
  <line x1="132" y1="24" x2="132" y2="96" stroke="#e5e7eb" stroke-width="1.2" stroke-linecap="round"/>

  <!-- "Care" — ExtraBold, emerald gradient -->
  <text
    x="143"
    y="68"
    font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif"
    font-size="54"
    font-weight="800"
    letter-spacing="-1.5"
    fill="url(#wordGrad)"
  >Care</text>

  <!-- "Pulse" — Light, neutral dark -->
  <text
    x="291"
    y="68"
    font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif"
    font-size="54"
    font-weight="300"
    letter-spacing="-1.5"
    fill="#1f2937"
  >Pulse</text>

  <!-- Tagline -->
  <text
    x="144"
    y="95"
    font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif"
    font-size="11.5"
    font-weight="500"
    letter-spacing="3.2"
    fill="#6b7280"
  >HEALTHCARE  ·  APPOINTMENTS</text>
</svg>
